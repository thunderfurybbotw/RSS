<h1>2026年10月22日 · 熱修正</h1>
<p class="meta"><time datetime="2026-10-22">2026年10月22日</time> · <a href="https://foreverchanges.pro/zh-tw/patch-notes">在 ForeverChanges 上查看原文</a></p>
<div class="bt-build-body"><p>10月16日版本之後的熱修正，10月22日首次發現，Blizzard的說明中沒有提到：127件僅限測試版的物品，是熔火之心掉落物及其傳說武器的複製品，物品等級30，1級即可使用；還有保留經典版套裝效果的9套T1套裝，以及幾種藥劑，其中一種可在1小時內使獲得的經驗變為3倍。它們不代表正式伺服器上的熔火之心。測試版已於10月23日關閉，Blizzard表示這些物品在WoW Forever上線後不會出現。</p></div>
