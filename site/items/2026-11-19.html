<div class="bt-build-body"><div class="pn-points"><p>11月17日用戶端的熱修正，11月19日19:52至20:00 UTC之間首次出現在開服伺服器傳送的快取中。暴雪尚未為其發布說明。不穩定的魔法微粒現在是拾取後綁定，簡易的裙子和簡易的黑裙子現在是布甲，Squall-breakers Potion現在可以摧毀。</p><section class="pn-topic" data-topic="items"><h3>物品</h3><ul class="pn-live-lines"><li><b>調整 </b><span>不穩定的魔法微粒現在是拾取後綁定。</span></li><li><b>調整 </b><span>簡易的裙子和簡易的黑裙子現在是布甲（原本是其他）。</span></li></ul></section><section class="pn-topic" data-topic="quests"><h3>任務</h3><ul class="pn-live-lines"><li><b>增強 </b><span>Squall-breakers Potion現在可以摧毀。</span></li></ul></section></div></div>
