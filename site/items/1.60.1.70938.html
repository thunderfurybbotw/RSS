<h1>2026年11月13日 · 版本 1.60.1.70938</h1>
<p class="meta"><time datetime="2026-11-13">2026年11月13日</time> · <a href="https://foreverchanges.pro/zh-tw/patch-notes#1.60.1.70938">在 ForeverChanges 上查看原文</a></p>
<div class="bt-build-body"><p>11月13日的用戶端，從其檔案讀取：Blizzard沒有為它發布說明。它把伺服器11月10日和11日的熱修正寫進用戶端本身，沒有任何天賦、職業法術、種族特長或物品有所不同。用戶端和伺服器之間只有一個數字不同：野性痊癒從治療加成獲得的效果。</p><div class="bt-notes pn-notes"><div><div class="pn-folds"></div><div class="bt-note-class bt-note-items" id="items"><h4><span>物品</span><small></small></h4><div class="bt-note-body"><p class="bt-items-note">沒有物品有所不同。用戶端現在包含伺服器熱修正早已設定的內容，例如商人販售的種族坐騎改為拾取後綁定，以及製作護甲較低的商人收購價。</p></div></div></div></div></div>
