<h1>2026年11月4日 · 熱修正</h1>
<p class="meta"><time datetime="2026-11-04">2026年11月4日</time> · <a href="https://foreverchanges.pro/zh-tw/patch-notes">在 ForeverChanges 上查看原文</a></p>
<div class="bt-build-body"><p>在天賦樹中試試這些變動：<a href="https://foreverchanges.pro/zh-tw/talents/warrior">戰士</a>。</p><p>上線客戶端的一次熱修正，於11月4日首次出現在上線伺服器傳送的快取中。它加入了暴雪上線說明中客戶端檔案沒有的三條內容：挑釁、防禦姿態和閃電鏈現在與說明一致。</p><div class="bt-notes pn-notes"><div><div class="pn-folds"><div class="bt-note-class pn-fold" data-class="warrior"><h4><span>戰士</span></h4><h4 class="pn-spec">防護</h4><ul class="pn-lines"><li><b>增強 </b><span class="pn-line"><a class="pn-live-spell" data-spell="calc-warrior-protection-defiance" href="https://foreverchanges.pro/zh-tw/talents/warrior#t=calc-warrior-protection-defiance">挑釁</a>：<!-- -->裝備盾牌時，防禦姿態下產生的威脅值依等級提高7%、13%和20%，而非5%、10%和15%。</span></li><li><b>增強 </b><span class="pn-line"><a class="pn-live-spell" data-spell="warrior-defensive-stance" href="https://foreverchanges.pro/zh-tw/spellbook/warrior#s=warrior-defensive-stance&amp;f=update">防禦姿態</a>：<!-- -->產生的所有威脅值提高80%，而非30%。</span></li></ul></div><div class="bt-note-class pn-fold" data-class="shaman"><h4><span>薩滿</span></h4><h4 class="pn-spec">元素戰鬥</h4><ul class="pn-lines"><li><b>增強 </b><span class="pn-line"><a class="pn-live-spell" data-spell="shaman-chain-lightning" href="https://foreverchanges.pro/zh-tw/spellbook/shaman#s=shaman-chain-lightning&amp;f=update">閃電鏈</a>：<!-- -->所有等級的施法時間為2秒，而非2.5秒。</span></li></ul></div></div></div></div></div>
