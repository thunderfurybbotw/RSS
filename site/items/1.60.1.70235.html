<p class="meta"><time datetime="2026-10-05">2026年10月5日</time> · <a href="https://foreverchanges.pro/zh-tw/patch-notes#1.60.1.70235">在 ForeverChanges 上查看原文</a></p>
<div class="bt-build-body"><p>Blizzard重新啟動了伺服器，「以套用一些修正」，但沒有說明是哪些。據玩家回報，PvP 2 伺服器的拍賣場自10月4日起關閉，現已恢復正常；好友名單也換了新外觀，多了新的分頁。用戶端本身只更新了當機回報和遊戲載入程式。天賦、法術和物品沒有變動。</p></div>
