<h1>2026年10月9日 · 版本 1.60.1.70334</h1>
<p class="meta"><time datetime="2026-10-09">2026年10月9日</time> · <a href="https://foreverchanges.pro/zh-tw/patch-notes#1.60.1.70334">在 ForeverChanges 上查看原文</a></p>
<div class="bt-build-body"><p>Blizzard 在10月9日晚上重新啟動了伺服器，只在遊戲中發出通知，大約停了40分鐘。用戶端只更新了當機回報、遊戲載入程式和圖形檔案。天賦、法術和物品都沒有變動。之後有測試者回報 WowB_loader.dll 錯誤，把檔案改名讓啟動器重新下載後就會消失。10月8日起消失的背包整理按鈕仍然沒有回來：在聊天框輸入 /click BagItemAutoSortButton 就能整理背包。</p></div>
