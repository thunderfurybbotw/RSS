<h1>2026年11月9日 · 熱修正</h1>
<p class="meta"><time datetime="2026-11-09">2026年11月9日</time> · <a href="https://foreverchanges.pro/zh-tw/patch-notes">在 ForeverChanges 上查看原文</a></p>
<div class="bt-build-body"><p>在天賦樹中試試這些變動：<a href="https://foreverchanges.pro/zh-tw/talents/druid">德魯伊</a>。</p><p>11月7日用戶端的熱修正，11月9日19:26至21:43 UTC之間首次出現在開服伺服器傳送的快取中。暴雪沒有為它發布說明：它把暴雪11月6日說明中列出的迅癒說明修正帶進用戶端。</p><div class="bt-notes pn-notes"><div><div class="pn-folds"><div class="bt-note-class pn-fold" data-class="druid"><h4><span>德魯伊</span></h4><h4 class="pn-spec">恢復</h4><ul class="pn-lines"><li class="is-wording"><b>調整 </b><span class="pn-line"><a class="pn-live-spell" data-spell="calc-druid-restoration-swiftmend" href="https://foreverchanges.pro/zh-tw/talents/druid#t=calc-druid-restoration-swiftmend">迅癒</a>：<!-- -->它的說明不再寫著會消耗效果：治療量相當於週期性效果的完整持續時間，原本寫的是被消耗法術的週期性效果。Blizzard 11月6日的說明稱這是說明修正。</span></li></ul></div></div></div></div></div>
