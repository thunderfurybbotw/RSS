<h1>2026年10月21日 · 熱修正</h1>
<p class="meta"><time datetime="2026-10-21">2026年10月21日</time> · <a href="https://foreverchanges.pro/zh-tw/patch-notes">在 ForeverChanges 上查看原文</a></p>
<div class="bt-build-body"><p>10月16日版本之後的熱修正，10月21日首次發現，Blizzard的說明中沒有提到：獵人印記等級4提供的遠程攻擊強度加倍，熔岩爆發等級3對受烈焰震擊影響的目標傷害提高20%，與其他等級相同。</p><div class="bt-notes pn-notes"><div class="pn-folds"><div class="bt-note-class pn-fold" data-class="hunter"><h4><span>獵人</span></h4><h4 class="pn-spec">射擊</h4><ul class="pn-lines"><li><b>增強 </b><span class="pn-line"><a class="pn-live-spell" href="https://foreverchanges.pro/zh-tw/spellbook/hunter#s=hunter-hunter-s-mark&amp;f=update">獵人印記</a>：<!-- -->等級4提供143點遠程攻擊強度，原為71。</span></li></ul></div><div class="bt-note-class pn-fold" data-class="shaman"><h4><span>薩滿</span></h4><h4 class="pn-spec">元素戰鬥</h4><ul class="pn-lines"><li><b>削弱 </b><span class="pn-line"><a class="pn-live-spell" href="https://foreverchanges.pro/zh-tw/spellbook/shaman#s=shaman-lava-burst&amp;f=update">熔岩爆發</a>：<!-- -->等級3對受烈焰震擊影響的目標傷害提高20%，原為54%，與其他等級相同。</span></li></ul></div></div></div></div>
