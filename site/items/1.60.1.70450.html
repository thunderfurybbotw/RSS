<div class="bt-build-body"><p>一次小型用戶端更新。只新增了一些外觀物品，Blizzard 還沒說明取得方式：三隻坐騎（翠綠海龜、赤紅公雞、鬼靈狼群）、三隻寵物（繁花樹人、吉耶爾、小粉粉）、兩套塑形套裝（鍍金大劍師護甲、靜水漁夫裝束），以及玩具冒險者帳篷，可以改變你的營地帳篷的外觀。天賦、法術和其他物品都沒有變動。</p></div>
