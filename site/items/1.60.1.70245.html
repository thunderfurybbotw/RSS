<div class="bt-build-body"><p>Blizzard重新啟動了伺服器，進行「優先修正」：本應在箱子裡補充卻不見了的任務物品、搭乘電梯或交通工具時偶爾會斷線的問題，以及加入或離開公會時可能出現的錯誤。用戶端本身只更新了當機回報和遊戲載入程式。天賦、法術和物品沒有變動。</p></div>
