<p class="meta"><time datetime="2026-11-10">2026年11月10日</time> · <a href="https://foreverchanges.pro/zh-tw/patch-notes#1.60.1.70888">在 ForeverChanges 上查看原文</a></p>
<div class="bt-build-body"><p>11月10日的用戶端。它包含11月7日至9日的伺服器熱修正，以及一項玩家會看到的改動：防護恐懼結界現在可以在暗影形態下施放。暴雪宣布的11月10日職業調整不在其中。</p><div class="bt-notes pn-notes"><div><div class="pn-lines-classes"><section data-class="priest" id="priest"><h3>牧師</h3><h4 class="pn-spec">神聖</h4><ul class="pn-lines"><li><b>調整 </b><span class="pn-line"><a class="pn-live-spell" data-spell="priest-fear-ward" href="https://foreverchanges.pro/zh-tw/spellbook/priest#s=priest-fear-ward&amp;f=update">防護恐懼結界</a>：<!-- -->它現在可以在暗影形態下施放，而之前暗影形態是唯一不能施放它的形態。它仍持續3分鐘，冷卻時間3分鐘。</span></li></ul></section></div><div class="bt-note-class bt-note-items" id="items"><h4><span>物品</span><small>1件物品已改動</small></h4><div class="bt-note-body"><section><h4>已改動的武器和護甲</h4><ul><li><a aria-hidden="true" data-tip="280604" href="https://foreverchanges.pro/zh-tw/item/280604/rage-of-the-storm" tabindex="-1"></a><div><a class="q3" data-tip="280604" href="https://foreverchanges.pro/zh-tw/item/280604/rage-of-the-storm">風暴之怒</a></div></li></ul></section></div></div></div></div></div>
